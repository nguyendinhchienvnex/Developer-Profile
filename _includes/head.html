<head>
  <meta charset="UTF-8">
  <title
    id="page-title"
    data-en="{{ page.title }} | {{ site.title }}"
    data-vi="{{ page.title_vi | default: page.title }} | {{ site.title }}"
  >
    {{ page.title }} | {{ site.title }}
  </title>
  <meta name="description" content="{{ site.description }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Khởi tạo ngôn ngữ ngay lập tức để tránh nháy giao diện -->
  <script src="{{ site.baseurl }}/assets/js/lang-init.js"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/images/favicon.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ site.baseurl }}/assets/images/favicon.png?v=2">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/images/favicon.png?v=2">

  <!-- Bootstrap CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">

  <!-- Page-Specific CSS (nếu trang có khai báo custom_css trong Front Matter) -->
  {% if page.custom_css %}
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/pages/{{ page.custom_css }}.css">
  {% endif %}
</head>
