items:
  - title_vi: "Nhà giả kim"
    title_en: "The Alchemist"
    author: "Paulo Coelho"
    cover: "/assets/images/nhagiakim.jpg"
    alt: "Nhà giả kim - The Alchemist"
    category_icon: "bi-compass"
    category_vi: "Tư duy &amp; Mục tiêu"
    category_en: "Purpose &amp; Grit"
    url: "https://breakdownblogs.wordpress.com/wp-content/uploads/2018/02/nha_gia_kim__paulo_coelho.pdf"
    note_vi: "Bài học về sự kiên định theo đuổi mục tiêu dài hạn, vượt qua vùng an toàn và khả năng thích nghi linh hoạt trước những biến số trên hành trình phát triển bản thân."
    note_en: "A timeless lesson on perseverance toward long-term vision, stepping beyond comfort zones, and adapting resiliently to unexpected challenges."

  - title_vi: "Đắc nhân tâm"
    title_en: "How to Win Friends & Influence People"
    author: "Dale Carnegie"
    cover: "/assets/images/dacnhantam.jpg"
    alt: "Đắc nhân tâm - How to Win Friends and Influence People"
    category_icon: "bi-people"
    category_vi: "Giao tiếp &amp; Đội nhóm"
    category_en: "Communication &amp; Empathy"
    url: "https://file.mentor.vn/files/lessons/file-1617004361169.pdf"
    note_vi: "Nền tảng của nghệ thuật lắng nghe thấu cảm và giao tiếp hiệu quả — chìa khóa giúp mình phối hợp mượt mà trong các team kỹ thuật (4–5 thành viên) và thấu hiểu bài toán của khách hàng."
    note_en: "Foundational principles of active listening and constructive communication—key to collaborating smoothly across engineering squads and understanding stakeholder needs."

  - title_vi: "Từ tốt đến vĩ đại"
    title_en: "Good to Great"
    author: "Jim Collins"
    cover: "/assets/images/vidai.jpg"
    alt: "Từ tốt đến vĩ đại - Good to Great"
    category_icon: "bi-graph-up-arrow"
    category_vi: "Chiến lược &amp; Kỷ luật"
    category_en: "Strategy &amp; Execution"
    url: "https://mekongstartup.vn/public/upload/files/tu-tot-den-vi-dai-jim-collins.pdf"
    note_vi: "Phân tích cách các tổ chức tạo bước nhảy vọt bền vững nhờ tư duy kỷ luật, chọn đúng người vào đúng vị trí và dùng công nghệ làm đòn bẩy tăng trưởng thay vì chạy theo trào lưu."
    note_en: "Examines how organizations achieve enduring breakthroughs through disciplined execution, getting the right people on the bus, and using technology as an accelerator."
