repo_url: "https://github.com/nguyendinhchienvnex/Route-Expense-Tracking"

pills:
  - "Python 3.10+"
  - "PyQt6 &amp; WebEngine"
  - "Folium + Google Satellite"
  - "OSRM Routing API"
  - "TSP + 2-opt Algorithm"
  - "Geopy (Nominatim)"
  - "SQLite3 (WAL Mode)"

tech_stack:
  - component_vi: "Ngôn ngữ lõi"
    component_en: "Core Language"
    library: "Python 3 (<code>3.10+</code>)"
    role_vi: "Xử lý logic nghiệp vụ, thuật toán tối ưu lộ trình và đa luồng bất đồng bộ (<code>QThread</code>)."
    role_en: "Business logic, route optimization algorithms, and asynchronous multithreading (<code>QThread</code>)."

  - component_vi: "Giao diện Desktop"
    component_en: "Desktop GUI"
    library: "PyQt6 (<code>QtWidgets</code>, <code>QtWebEngineWidgets</code>, <code>QtSvg</code>)"
    role_vi: "Giao diện Dark Mode (Fusion), nhúng trình duyệt bản đồ tương tác và render biểu tượng SVG."
    role_en: "Dark Mode (Fusion) UI, embedded interactive map browser, and SVG icon rendering."

  - component_vi: "Bản đồ &amp; Trực quan hóa"
    component_en: "Mapping &amp; GIS"
    library: "Folium + Google Satellite Tiles"
    role_vi: "Kết xuất bản đồ vệ tinh tương tác ra HTML (<code>map_cache.html</code>) và hiển thị qua <code>QWebEngineView</code>."
    role_en: "Renders interactive satellite maps to HTML (<code>map_cache.html</code>) displayed via <code>QWebEngineView</code>."

  - component_vi: "Tính toán Lộ trình"
    component_en: "Routing Engine"
    library: "OSRM API (<code>router.project-osrm.org</code>)"
    role_vi: "Truy vấn khoảng cách và hình học tuyến đường lái xe thực tế theo mạng lưới giao thông."
    role_en: "Queries real-world road-network driving distances and route geometries."

  - component_vi: "Định vị Địa lý"
    component_en: "Geocoding"
    library: "<code>geopy</code> (Nominatim / OpenStreetMap)"
    role_vi: "Chuyển đổi địa chỉ văn bản sang tọa độ địa lý <code>(latitude, longitude)</code> trên luồng nền <code>GeocodeWorker</code>."
    role_en: "Converts text addresses into <code>(latitude, longitude)</code> coordinates on background <code>GeocodeWorker</code> threads."

  - component_vi: "Cơ sở dữ liệu"
    component_en: "Database"
    library: "SQLite3 (<code>WAL Mode</code>)"
    role_vi: "Lưu trữ dữ liệu cục bộ hiệu năng cao với Triggers ràng buộc toàn vẹn và hỗ trợ truy cập đa luồng."
    role_en: "High-performance local persistence with integrity Triggers and concurrent read/write support."

modules:
  - icon: "bi-map-fill"
    title_vi: "Điều phối Lộ trình &amp; Bản đồ Vệ tinh"
    title_en: "Route Dispatching &amp; Satellite Mapping"
    items:
      - vi: "<strong>Gom đơn thông minh:</strong> Chọn nhiều khách hàng từ CSDL; tự động tổng hợp danh mục và khối lượng hàng hóa cần giao."
        en: "<strong>Smart Order Consolidation:</strong> Select multiple customers from the DB to automatically aggregate item quantities."
      - vi: "<strong>Bản đồ vệ tinh trực quan:</strong> Phân biệt màu sắc <strong>Kho hàng</strong> (tím), <strong>Xe sẵn sàng</strong> (xanh dương), <strong>Điểm giao</strong> (đỏ) và cho phép click trực tiếp lên bản đồ để thêm điểm giao tùy chỉnh."
        en: "<strong>Interactive Satellite Map:</strong> Color-coded markers for <strong>Warehouses</strong> (purple), <strong>Available Trucks</strong> (blue), and <strong>Drop-offs</strong> (red), supporting direct map-click waypoints."
      - vi: "<strong>Tối ưu cặp (Xe + Kho xuất):</strong> Đối chiếu tải trọng xe, tồn kho thực tế và định mức nhiên liệu để đề xuất phương án tiết kiệm nhất."
        en: "<strong>Optimal (Truck + Warehouse) Matching:</strong> Cross-checks vehicle capacity, warehouse stock, and fuel consumption to recommend the lowest-cost dispatch plan."
      - vi: "<strong>Xác nhận Xuất kho tự động:</strong> Tự động trừ tồn kho, chuyển trạng thái xe sang <code>In Delivery</code> và lưu biên bản vào bảng <code>reports</code>."
        en: "<strong>Automated Dispatch &amp; Stock Deduction:</strong> Automatically deducts warehouse inventory, updates truck status to <code>In Delivery</code>, and logs records into <code>reports</code>."

  - icon: "bi-truck"
    title_vi: "Quản trị Tài nguyên, Bảo mật &amp; Báo cáo"
    title_en: "Resource Management, Security &amp; Reports"
    items:
      - vi: "<strong>3 Tab quản trị độc lập:</strong> Quản lý <strong>ĐỘI XE</strong>, <strong>KHO HÀNG</strong> và <strong>KHÁCH HÀNG</strong> kèm định vị tọa độ tự động từ địa chỉ văn bản."
        en: "<strong>3 Dedicated Admin Tabs:</strong> Manage <strong>TRUCKS</strong>, <strong>WAREHOUSES</strong>, and <strong>CUSTOMERS</strong> with automatic text-to-coordinate geocoding."
      - vi: "<strong>Toàn vẹn dữ liệu &amp; Khôi phục:</strong> Trigger CSDL tự động dọn dẹp tồn kho liên quan khi xóa tài nguyên; tích hợp nút <strong>FORCE RESET DATABASE</strong> khôi phục dữ liệu mẫu TP.HCM."
        en: "<strong>Data Integrity &amp; Reset:</strong> SQLite Triggers automatically clean up orphaned inventory records; includes a <strong>FORCE RESET DATABASE</strong> utility with HCMC seed data."
      - vi: "<strong>Xác thực &amp; Duy trì phiên:</strong> Bảo mật mật khẩu bằng thuật toán băm <strong>SHA-256</strong> và ghi nhớ đăng nhập an toàn qua tệp <code>session.txt</code>."
        en: "<strong>Authentication &amp; Session Persistence:</strong> Passwords hashed with <strong>SHA-256</strong> and persistent login sessions managed via <code>session.txt</code>."
      - vi: "<strong>Nhật ký Xuất kho:</strong> Theo dõi toàn bộ lịch sử điều phối (mã giao dịch, thời gian, loại hàng, khối lượng, biển số xe, kho xuất và đối tác nhận)."
        en: "<strong>Outbound Dispatch Logs:</strong> Full audit trail of transaction IDs, timestamps, cargo weights, assigned vehicles, origin warehouses, and recipients."

algorithm_steps:
  - vi: "<strong>Lọc điều kiện ràng buộc:</strong> Loại bỏ xe đang bận (<code>In Delivery</code>), xe thiếu tải trọng và các kho không đủ tồn kho cho toàn bộ đơn hàng gom."
    en: "<strong>Constraint Filtering:</strong> Excludes busy trucks (<code>In Delivery</code>), under-capacity vehicles, and warehouses lacking required item stock."
  - vi: "<strong>Tối ưu thứ tự điểm dừng (TSP + 2-opt):</strong> Dựng lộ trình khởi tạo bằng giải thuật tham lam <strong>Nearest Neighbor (Greedy TSP)</strong> từ kho qua các điểm giao, sau đó hoán đổi cạnh bằng thuật toán <strong>2-opt</strong> để loại bỏ các đoạn đường giao chéo."
    en: "<strong>Stop Ordering (TSP + 2-opt):</strong> Generates an initial route via <strong>Nearest Neighbor (Greedy TSP)</strong> and refines it with <strong>2-opt</strong> edge swaps to eliminate crossing paths."
  - vi: "<strong>Đo khoảng cách đường bộ thực tế &amp; Chọn phương án rẻ nhất:</strong> Truy vấn tổng quãng đường thực tế $D$ ($\\text{km}$) qua <strong>OSRM API</strong>, tính chi phí nhiên liệu cho mọi cặp $(\\text{Xe}_i, \\text{Kho}_j)$ hợp lệ và chọn phương án tối ưu nhất."
    en: "<strong>Real Road Distance &amp; Cost Selection:</strong> Fetches real-world driving distance $D$ ($\\text{km}$) via <strong>OSRM API</strong>, evaluates fuel cost across all valid $(\\text{Truck}_i, \\text{Warehouse}_j)$ pairs, and selects the minimum-cost plan."

formula_vars:
  - symbol: "$D$"
    vi: "Tổng quãng đường di chuyển thực tế tính theo mạng lưới đường bộ ($\\text{km}$)."
    en: "Total actual road-network driving distance ($\\text{km}$)."
  - symbol: "$C_{\\text{fuel}}$"
    vi: "Định mức tiêu hao nhiên liệu của từng xe ($\\text{lít} / 100\\text{km}$)."
    en: "Vehicle fuel consumption rate ($\\text{liters} / 100\\text{km}$)."
  - symbol: "$P_{\\text{fuel}}$"
    vi: "Đơn giá nhiên liệu cấu hình trong <code>core/algorithms.py</code> (<code>FUEL_PRICE_VND = 23500</code> $\\text{VNĐ/lít}$)."
    en: "Configured fuel unit price in <code>core/algorithms.py</code> (<code>FUEL_PRICE_VND = 23500</code> $\\text{VND/liter}$)."

db_tables:
  - name: "users"
    desc_vi: "Tài khoản điều phối viên (<code>username</code>, <code>password</code> băm SHA-256)."
    desc_en: "Coordinator accounts (<code>username</code>, SHA-256 hashed <code>password</code>)."
  - name: "trucks"
    desc_vi: "Đội xe (<code>name</code>, <code>capacity</code>, <code>fuel_consumption</code>, <code>lat</code>, <code>lon</code>, <code>status</code>)."
    desc_en: "Fleet records (<code>name</code>, <code>capacity</code>, <code>fuel_consumption</code>, <code>lat</code>, <code>lon</code>, <code>status</code>)."
  - name: "warehouses"
    desc_vi: "Hệ thống kho bãi (<code>name</code>, <code>capacity</code>, <code>address</code>, <code>lat</code>, <code>lon</code>)."
    desc_en: "Warehouse facilities (<code>name</code>, <code>capacity</code>, <code>address</code>, <code>lat</code>, <code>lon</code>)."
  - name: "customers"
    desc_vi: "Điểm giao hàng (<code>name</code>, <code>address</code>, <code>lat</code>, <code>lon</code>)."
    desc_en: "Customer delivery nodes (<code>name</code>, <code>address</code>, <code>lat</code>, <code>lon</code>)."
  - name: "inventory"
    desc_vi: "Tồn kho xe/kho &amp; nhu cầu khách (<code>owner_type</code>, <code>owner_id</code>, <code>item_name</code>, <code>quantity</code>)."
    desc_en: "Vehicle/warehouse stock &amp; order demand (<code>owner_type</code>, <code>owner_id</code>, <code>item_name</code>, <code>quantity</code>)."
  - name: "reports"
    desc_vi: "Lịch sử lệnh điều phối và biên bản xuất kho đã xác nhận."
    desc_en: "Confirmed dispatch orders and outbound warehouse logs."
