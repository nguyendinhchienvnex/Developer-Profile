experiences:
  - id: "exp-ai-power"
    company: "AI Power (HCM)"
    role: "Software Engineer"
    period: "03/2026 – 08/2026"
    project_vi: "Dự án: AP-Enterprise Management Suite (ERP/CRM) · Quy mô: 4 thành viên"
    project_en: "Project: AP-Enterprise Management Suite (ERP/CRM) · Team size: 4 members"
    desc_vi: "Nền tảng hoạch định nguồn lực doanh nghiệp (ERP) và quản trị khách hàng (CRM) toàn diện nhằm số hóa vận hành, tích hợp cổng thanh toán bảo mật và đóng vai trò hạ tầng backend lõi cho hệ sinh thái các module AI của công ty."
    desc_en: "A comprehensive enterprise resource planning (ERP) and CRM platform designed to digitize business operations, featuring secure payment integrations and serving as the core backend infrastructure for the company's AI module ecosystem."
    tech:
      - "Python"
      - "Django"
      - "ReactJS"
      - "TypeScript"
      - "PostgreSQL"
      - "MySQL"
      - "RESTful APIs"
      - "Git"
    bullets:
      - vi: "Thiết kế và xây dựng kiến trúc End-to-End cho hệ thống quản trị doanh nghiệp, kết nối liền mạch backend <strong>Django REST</strong> với giao diện <strong>ReactJS</strong> để tự động hóa các quy trình nghiệp vụ phức tạp."
        en: "Engineered the end-to-end architecture for the enterprise management system, seamlessly integrating a robust <strong>Django REST</strong> backend with a responsive <strong>ReactJS</strong> front-end to automate complex client workflows."
      - vi: "Phát triển các bảng điều khiển (dashboard) trực quan hóa dữ liệu lớn bằng ReactJS, tối ưu quản lý trạng thái để hiển thị mượt mà <strong>10.000+ bản ghi</strong> mà không gây nghẽn giao diện (UI blocking)."
        en: "Developed dynamic, data-intensive administrative dashboards using ReactJS to visualize operational metrics, utilizing efficient state management to render <strong>10,000+ records</strong> without UI blocking."
      - vi: "Thiết kế và cung cấp các RESTful APIs có khả năng mở rộng cao để tiếp nhận, xử lý luồng dữ liệu từ các module AI nội bộ (phân tích tự động, camera thông minh), kết nối trực tiếp lõi AI với giao diện người dùng cuối."
        en: "Designed and exposed scalable RESTful APIs to ingest and process data streams from internal AI modules (automated analytics, smart cameras), bridging AI engines with the end-user interface."
      - vi: "Triển khai cơ chế phân quyền chi tiết theo vai trò (<strong>RBAC</strong>) trên backend Django, đảm bảo cô lập dữ liệu nghiêm ngặt và tuân thủ quy tắc phân quyền qua nhiều cấp tổ chức."
        en: "Implemented a granular Role-Based Access Control (<strong>RBAC</strong>) mechanism on the Django backend, enforcing strict data isolation and permission rules across multiple organizational tiers."
      - vi: "Tích hợp cổng thanh toán bên thứ ba và giao thức đồng bộ dữ liệu POS, đảm bảo tuân thủ nghiêm ngặt tính toàn vẹn giao dịch chuẩn <strong>ACID</strong>."
        en: "Integrated secure third-party payment gateways and POS data synchronization protocols, ensuring strict <strong>ACID</strong> compliance for financial transactions."
      - vi: "Xử lý triệt để nút thắt cổ chai <strong>N+1 query</strong> trên Django ORM kết hợp phân trang động phía Frontend, giảm thời gian tải dashboard chính từ <strong>4 giây xuống dưới 1.5 giây</strong>."
        en: "Resolved <strong>N+1 query</strong> bottlenecks in the Django ORM and implemented front-end dynamic pagination, reducing the main dashboard's data load time from <strong>4 seconds to under 1.5 seconds</strong>."

  - id: "exp-hitech"
    company: "HI-TECH SOLUTION (HCM)"
    role: "Backend Engineer"
    period: "06/2025 – 03/2026"
    project_vi: "Dự án: HI-Nexus IoT Core · Quy mô: 5 thành viên"
    project_en: "Project: HI-Nexus IoT Core · Team size: 5 members"
    desc_vi: "Hạ tầng backend IoT có khả năng mở rộng cao được thiết kế để thay thế hệ thống monolithic cũ, đáp ứng xử lý đồng thời dữ liệu đo lường (telemetry) từ hàng nghìn thiết bị thông minh mà không gây nghẽn cơ sở dữ liệu."
    desc_en: "Scalable IoT backend infrastructure designed to replace the client's legacy monolithic system, capable of processing concurrent telemetry data from thousands of smart devices without database bottlenecking."
    tech:
      - "Python"
      - "FastAPI"
      - "PostgreSQL"
      - "Redis"
      - "MQTT / WebSockets"
      - "Docker"
      - "Git"
    bullets:
      - vi: "Chuyển đổi kiến trúc REST đồng bộ cũ sang backend bất đồng bộ <strong>FastAPI</strong>, giải quyết triệt để lỗi timeout kết nối và xử lý thành công <strong>500+ yêu cầu thiết bị đồng thời</strong>."
        en: "Migrated the legacy synchronous REST architecture to an asynchronous <strong>FastAPI</strong> backend, resolving connection timeout issues and successfully handling <strong>500+ concurrent device requests</strong>."
      - vi: "Thiết kế lại lược đồ cơ sở dữ liệu PostgreSQL áp dụng kỹ thuật phân vùng bảng (<strong>Table Partitioning</strong>) và ghi theo lô (<strong>Batch Inserts</strong>), loại bỏ hoàn toàn hiện tượng khóa bảng (DB locking) khi nạp dữ liệu chuỗi thời gian tần suất cao."
        en: "Redesigned PostgreSQL database schemas utilizing <strong>table partitioning</strong> and <strong>batch inserts</strong>, eliminating database locking issues during high-frequency time-series telemetry data ingestion."
      - vi: "Triển khai cơ chế truyền tin <strong>MQTT với các mức QoS</strong> đảm bảo không thất thoát dữ liệu (zero data loss) đối với các gói tin quan trọng trong điều kiện mạng không ổn định."
        en: "Implemented <strong>QoS-level MQTT</strong> message brokering to guarantee zero data loss for critical device telemetry during unstable network conditions."
      - vi: "Chuyển tải các truy vấn trạng thái thiết bị lặp lại từ PostgreSQL sang bộ nhớ đệm <strong>Redis Cache</strong>, giảm đáng kể tải đọc cơ sở dữ liệu và ngăn ngừa nghẽn truy vấn vào giờ cao điểm."
        en: "Offloaded repetitive device state queries from PostgreSQL to <strong>Redis cache</strong>, significantly reducing database read load and preventing query bottlenecking during peak traffic."
      - vi: "Chuẩn hóa môi trường phát triển bằng <strong>Docker Compose</strong>, giải quyết xung đột môi trường giữa 5 thành viên trong nhóm và đảm bảo tính đồng nhất giữa Local, Staging và Production."
        en: "Standardized the development environment using <strong>Docker Compose</strong>, resolving environment conflicts across the 5-member team and ensuring strict parity between local, staging, and production."
      - vi: "Áp dụng kiến trúc <strong>Clean Architecture</strong> và cơ chế xử lý ngoại lệ chặt chẽ, giảm tỷ lệ sập API và tối thiểu hóa thời gian gián đoạn hệ thống khi thiết bị ngắt kết nối đột ngột."
        en: "Enforced <strong>clean architecture</strong> and robust error handling, reducing API crash rates and minimizing system downtime during unhandled device disconnects."

