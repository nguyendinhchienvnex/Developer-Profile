pillars:
  - number_icon: "bi-1-circle-fill"
    category_icon: "bi-layers"
    category: "Architecture &amp; Clean Code"
    tags:
      - "SOLID"
      - "System Design"
    title_vi: "Tư duy thiết kế hệ thống &amp; Viết mã nguồn bền vững"
    title_en: "System Design Mindset &amp; Maintainable Code Architecture"
    image: "/assets/images/blog-1.jpg"
    image_alt: "System Design and Clean Architecture"
    image_position: "right"
    intro_vi: 'Khi trực tiếp phát triển các hệ thống quy mô lớn như nền tảng <strong>ERP/CRM doanh nghiệp</strong> hay hạ tầng <strong>IoT thời gian thực</strong>, viết code chỉ để "chạy được" là chưa đủ — hệ thống bắt buộc phải đảm bảo <strong>tính rõ ràng, khả năng mở rộng (scalability) và dễ bảo trì</strong>:'
    intro_en: 'When building production platforms like an <strong>Enterprise ERP/CRM suite</strong> or a <strong>real-time IoT core</strong>, writing code that merely "works" is never enough—architecture must prioritize <strong>clarity, scalability, and long-term maintainability</strong>:'
    bullets:
      - vi: "Phân tích luồng dữ liệu và nút thắt cổ chai trước khi triển khai mã nguồn"
        en: "Analyzing data flows and concurrency bottlenecks prior to implementation"
      - vi: "Áp dụng nguyên lý <strong>OOP, SOLID &amp; Clean Architecture</strong> để tách biệt nghiệp vụ và hạ tầng"
        en: "Applying <strong>OOP, SOLID &amp; Clean Architecture</strong> to decouple business logic from infrastructure"
      - vi: "Chuẩn hóa môi trường làm việc với <strong>Docker Compose</strong> để đồng bộ từ Local đến Production"
        en: "Standardizing environments with <strong>Docker Compose</strong> for strict parity from Local to Production"
    outro_vi: "Ghi chép này tổng hợp cách mình tổ chức cấu trúc dự án, thiết kế RESTful APIs chuẩn mực và làm việc hiệu quả trong nhóm kỹ thuật."
    outro_en: "This note outlines how I structure repositories, design clean RESTful APIs, and collaborate effectively across engineering teams."

  - number_icon: "bi-2-circle-fill"
    category_icon: "bi-bug"
    category: "Post-Mortem &amp; Performance Tuning"
    tags:
      - "Django ORM"
      - "PostgreSQL"
      - "Redis"
    title_vi: "Phân tích Case kỹ thuật: Tối ưu hiệu năng &amp; Xử lý sự cố thực tế"
    title_en: "Engineering Post-Mortem: Performance Bottlenecks &amp; Root Cause Debugging"
    image: "/assets/images/blog-2.jpg"
    image_alt: "Performance Tuning and Root Cause Debugging"
    image_position: "left"
    intro_vi: "Những bài học đắt giá nhất luôn đến từ việc xử lý sự cố chịu tải thực tế — từ lỗi <strong>N+1 query trên Django ORM</strong> làm chậm dashboard, hiện tượng khóa bảng khi ghi dữ liệu IoT tần suất cao, cho đến lỗi timeout kết nối đồng bộ."
    intro_en: "The most valuable engineering lessons come from resolving real production bottlenecks—from <strong>Django ORM N+1 queries</strong> slowing down dashboards, to table locking during high-frequency IoT ingestion, and synchronous connection timeouts."
    sub_intro_vi: "Mỗi case kỹ thuật đều được mình hệ thống hóa theo quy trình 5 bước chuẩn:"
    sub_intro_en: "Each technical post-mortem follows a structured 5-step debugging framework:"
    bullets:
      - vi: "<strong>Bối cảnh &amp; Chỉ số đo lường:</strong> Xác định triệu chứng (ví dụ: thời gian tải trang 4s, nghẽn 500+ kết nối)"
        en: "<strong>Context &amp; Telemetry:</strong> Quantifying symptoms (e.g., 4s dashboard latency, 500+ concurrent stream bottlenecks)"
      - vi: "<strong>Truy vết nguyên nhân gốc (Root Cause):</strong> Profiling truy vấn SQL, kiểm tra lock DB và luồng bất đồng bộ"
        en: "<strong>Root Cause Analysis:</strong> SQL query profiling, inspecting DB locks, and tracing event-loop blocking"
      - vi: "<strong>Kiểm chứng giả thuyết:</strong> Tái hiện tải trên môi trường cô lập và đo đạc từng phương án"
        en: "<strong>Hypothesis Verification:</strong> Reproducing load in isolated environments and benchmarking fixes"
      - vi: "<strong>Giải pháp tối ưu:</strong> Áp dụng Batch Inserts, Table Partitioning, Redis Cache hoặc Async FastAPI"
        en: "<strong>Production Fix:</strong> Implementing Batch Inserts, Table Partitioning, Redis Caching, or Async FastAPI"
      - vi: "<strong>Checklist phòng ngừa:</strong> Chuẩn hóa quy tắc review code và giám sát cho các dự án kế tiếp"
        en: "<strong>Preventive Checklist:</strong> Establishing code review rules and monitoring alerts for future releases"

  - number_icon: "bi-3-circle-fill"
    category_icon: "bi-journal-bookmark-fill"
    category: "Continuous Learning"
    tags:
      - "Engineering Books"
      - "AI Workflows"
    title_vi: "Tổng hợp kiến thức từ sách kỹ thuật &amp; Công nghệ mới"
    title_en: "Distilling Insights from Engineering Books &amp; Emerging Tech"
    image: ""
    image_position: "none"
    intro_vi: "Bên cạnh việc triển khai dự án, mình duy trì thói quen đọc tài liệu chuyên sâu về kiến trúc hệ thống, cơ sở dữ liệu và ứng dụng mô hình AI vào quy trình phát triển phần mềm. Để biến kiến thức thành năng lực thực tế, mỗi ghi chú đều gói gọn trong 3 trọng tâm:"
    intro_en: "Alongside building production software, I continuously study system architecture, database internals, and AI-assisted development workflows. To turn reading into actionable engineering skill, every note distills three core takeaways:"
    bullets:
      - vi: "<strong>Tư tưởng cốt lõi:</strong> Mô hình hóa bài toán mà cuốn sách hoặc tài liệu kỹ thuật giải quyết"
        en: "<strong>Core Mental Model:</strong> The fundamental architectural problem the book or whitepaper addresses"
      - vi: "<strong>3–5 nguyên lý đắt giá:</strong> Các trade-off kỹ thuật quan trọng cần cân nhắc khi thiết kế hệ thống"
        en: "<strong>3–5 Key Engineering Principles:</strong> Critical architectural trade-offs to weigh in real-world design"
      - vi: "<strong>Hành động áp dụng ngay:</strong> Một cải tiến cụ thể đưa thẳng vào codebase hoặc quy trình làm việc hằng ngày"
        en: "<strong>Immediate Action Item:</strong> A concrete improvement applied directly to my active codebase or daily workflow"
